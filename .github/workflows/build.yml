name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fonts for the poster badge tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libfontconfig1 fonts-dejavu-core

      - name: Test
        run: dotnet test Bloom.slnx -c Release

      - name: Build
        run: dotnet publish src/Jellyfin.Plugin.Bloom -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: bloom
          path: out/Jellyfin.Plugin.Bloom.dll
